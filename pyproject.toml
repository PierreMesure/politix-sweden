[project]
name = "politix-sweden"
version = "0.1.0"
description = "A small dashboard to see which Swedish politicians are on X, Bluesky and Mastodon"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
    "sparqlwrapper>=2.0.0",
    "twscrape>=0.21.0",
]

[tool.uv]
# 0.21.0 contains the X compatibility fixes needed by the scraper.
exclude-newer-package = { twscrape = false }
